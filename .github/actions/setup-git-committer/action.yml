name: "Setup Git Committer"
description: "Configure git user and token for commits"
inputs:
  token:
    description: "GitHub token (defaults to github.token)"
    required: false
outputs:
  token:
    description: "GitHub token"
    value: ${{ inputs.token || github.token }}
runs:
  using: "composite"
  steps:
    - name: Configure git user
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin https://x-access-token:${{ inputs.token || github.token }}@github.com/${{ github.repository }}
      shell: bash
